version: '3.8'

services:

#  app:
#    image: serogin/university-spring
#    container_name: university-spring
#    networks:
#      - backend
#    depends_on:
#      - db_main
#      - db_test
#    stdin_open: true
#    tty: true

  db_main:
    image: 'postgres:latest'
    container_name: db_main
    ports:
      - "5432:5432"
    networks:
      - backend
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: university
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - db_master:/var/lib/postgresql/data

  db_test:
    image: 'postgres:latest'
    container_name: db_test
    ports:
      - "5050:5432"
    networks:
      - backend
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: university
    deploy:
      restart_policy:
        condition: on-failure
        
  pgadmin:
    container_name: pgadmin4_container
    image: 'dpage/pgadmin4'
    networks:
      - backend
    depends_on: 
      - db_main
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "80:80"

networks:
  backend:

volumes:
  db_master: {}