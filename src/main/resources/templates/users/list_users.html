<!DOCTYPE HTML>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5
http://www.thymeleaf.org/thymeleaf-extras-springsecurity5 ">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <link rel="stylesheet"
          th:href="@{css/style.css}" />

    <title>Student Directory</title>
</head>

<body>

<div class="container">

    <h3>Users Directory</h3>
    <hr>

    <div>
        User: <span sec:authentication="name"></span>
        <br>
        Role(s): <span sec:authentication="principal.authorities"></span>
        <br><br>
    </div>

    <form th:action="@{/users/userList}" class="form-inline">
        <a th:href="@{/registration}"
           class="btn btn-primary btn-sm mr-5 mb-3">
            Add User
        </a>

        <label>
            <input class="form-control  ml-5 mr-sm-2 mb-3" type="search" name="username"
                   placeholder="Search by name"/>
        </label>

        <button class="btn btn-success mb-3" type="submit">Search</button>
    </form>


    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>User Id</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Active</th>
            <th>Role</th>

            <div sec:authorize="hasAnyRole('ROLE_MANAGER', 'ROLE_ADMIN')">
                <th>Action</th>
            </div>
        </tr>
        </thead>

        <tbody>
        <tr th:each="teamUser : ${users}">

            <td th:text="${teamUser.id}"/>
            <td th:text="${teamUser.username}"/>
            <td th:text="${teamUser.email}"/>
            <td th:text="${teamUser.active}"/>
            <td th:text="${teamUser.roles}"/>

            <div   sec:authorize="hasAnyRole('ROLE_ADMIN')">

                <td>
                    <div class="flex-parent" sec:authorize="hasAnyRole('ROLE_MANAGER', 'ROLE_ADMIN')">
                        <a th:href="@{/users/showFormForUpdate(teamUser=${teamUser.id})}"
                           class="btn btn-info btn-sm">
                            Update
                        </a>
                    </div>
                    <div class="jc-center" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a th:href="@{/users/delete(usertId=${teamUser.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="if (!(confirm('Are you sure you want to delete this user?'))) return false">
                            Delete
                        </a>
                    </div>
                </td>

            </div>

        </tr>
        </tbody>
    </table>

    <!-- Add a logout button -->
    <form action="#" th:action="@{/logout}"
          method="POST">

        <input type="submit" value="Logout" class="btn btn-outline-primary mt-2"/>

    </form>

</div>

</body>
</html>
